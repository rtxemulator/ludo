name: CI

on:
  push:
    branches: [main, 'milestone-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: Engine (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Engine purity (no Flutter imports)
        run: |
          if grep -rn "package:flutter" lib/engine/; then
            echo "::error::lib/engine/ must never import Flutter"
            exit 1
          fi

      - name: Install dependencies
        run: dart pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: dart test

  app:
    name: App (analyze + test + release APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --project-name ludo_app --org dev.ludo .
          rm -f test/widget_test.dart

      # One-off: export the generated android/ so it can be committed
      # (native haptics channel needs real platform files). Removed again
      # once app/android/ is in the repo.
      - uses: actions/upload-artifact@v4
        with:
          name: android-platform
          path: app/android
          include-hidden-files: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: APK size
        run: |
          ls -l build/app/outputs/flutter-apk/*.apk
          echo "APK: $(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ludo-arm64-release
          path: app/build/app/outputs/flutter-apk/app-release.apk
