include: package:lints/recommended.yaml

analyzer:
  exclude:
    # Flutter app has its own pubspec/analysis (CI job `app`).
    - app/**
  errors:
    # Engine must stay pure Dart; see CLAUDE.md
    uri_does_not_exist: error

linter:
  rules:
    - prefer_const_constructors
    - prefer_final_fields
    - avoid_print
